<body>
  <header>

    <span>Problems</span>

  <div class="layout-body">
    <div class="problem-panel">
      <div class="text-title-large" data-cy="question-title">146. LRU Cache</div>

      <p style="color: #9e9e9e; font-size: 14px; line-height: 1.6;">
        Design a data structure that follows the constraints of a <strong>Least Recently Used (LRU) cache</strong>.
      </p>
    </div>

    <div class="editor-panel">
      <div class="editor-code">
        class LRUCache {<br>
        &nbsp;&nbsp;constructor(capacity) {<br>
        &nbsp;&nbsp;&nbsp;&nbsp;this.capacity = capacity;<br>
        &nbsp;&nbsp;&nbsp;&nbsp;this.map = new Map();<br>
        &nbsp;&nbsp;}<br>
        }

          }

      };
    }

    // Trigger Accepted
    document.getElementById('btn-submit-solution').addEventListener('click', () => {

      setTimeout(() => {

      }, 300);
    });

    document.getElementById('btn-submit-wrong').addEventListener('click', () => {
      const box = document.getElementById('submission-result-box');
      box.innerHTML = '<span style="color: #ffa116;">Pending...</span>';

        box.innerHTML = '<span data-e2e-locator="submission-result" style="color: #ef4444;">Wrong Answer</span>';
